volume = 0
# Choose a service with Esc; T opens Tidal and Y opens YouTube.
provider = "ytmusic"
initial_directory = "~/Music"
eq_preset = "Flat"
visualizer = "Dots"
sample_rate = 0
bit_depth = 32

theme = "ANSIgray"
shuffle = false
# Give the playlist every spare row instead of centering a short frame (Ctrl+X toggles).
expanded = true
padding_horizontal = 1
padding_vertical = 0
speed = 1.00
[tidal]
enabled = true
quality = "lossless"

# Uses your YouTube Music sign-in in Safari.
[ytmusic]
cookies_from = "safari"
expand_playlist = true

[soundcloud]
enabled = true
user = "jdsimcoe"
cookies_from = "safari"
