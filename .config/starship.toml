"$schema" = 'https://starship.rs/config-schema.json'
format = "$directory$custom$git_branch$git_status"
add_newline = false

[aws]
symbol = " "

[buf]
symbol = " "

[bun]
symbol = " "

[c]
symbol = " "

[cpp]
symbol = " "

[cmake]
symbol = " "

[conda]
symbol = " "

[crystal]
symbol = " "

[dart]
symbol = " "

[deno]
symbol = " "

[directory]
format = "[ $path ]($style)[$read_only]($read_only_style)"
style = "fg:black bg:bright-purple bold"
truncation_length = 3
truncate_to_repo = true
home_symbol = "~"
read_only = " 󰌾 "
read_only_style = "fg:black bg:bright-purple bold"

[custom.end_cap]
description = "Purple caret after $directory when not in a git repo"
when = "dir=$PWD; while [ \"$dir\" != / ]; do [ -e \"$dir/.git\" ] && exit 1; parent=${dir%/*}; [ \"$parent\" = \"$dir\" ] && break; dir=$parent; done; exit 0"
command = "true"
format = "[]($style)"
style = "fg:bright-purple"

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[fennel]
symbol = " "

[fortran]
symbol = " "

[fossil_branch]
symbol = " "

[gcloud]
symbol = " "

[git_branch]
format = "[](fg:bright-purple bg:bright-black)[  $branch ]($style)"
symbol = ""
style = "fg:bright-white bg:bright-black bold"

[git_commit]
tag_symbol = '  '

[git_status]
format = '[ $all_status$ahead_behind ]($style)[](fg:bright-black)'
style = "fg:bright-white bg:bright-black bold"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
conflicted = "="
deleted = "✘"
modified = "!"
renamed = "»"
staged = "+"
stashed = "\\$"
untracked = "?"
up_to_date = ""

