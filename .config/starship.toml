[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold purple"
truncation_length = 3
truncate_to_repo = true
home_symbol = "~"
read_only = " 󰌾"
read_only_style = "white"

[docker_context]
symbol = " "

[elixir]
