[git_branch]
format = "[$branch]($style) "
only_attached = true
style = "white"

[git_commit]
format = "[$hash$tag]($style) "
style = "white"
tag_symbol = '  '

[git_state]
format = "[$state( $progress_current/$progress_total)]($style) "
style = "yellow"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "yellow"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
conflicted = "="
deleted = "✘"
modified = "!"
renamed = "»"
staged = "+"
stashed = "\\$"
untracked = "?"
up_to_date = ""

