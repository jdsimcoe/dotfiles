"$schema" = 'https://starship.rs/config-schema.json'
# Minimal Vercel/Geist-inspired prompt, e.g.  dotfiles main !? ▲
# No background blocks: the terminal background shows through. Colors are
# named ANSI colors, so they come from the terminal theme and switch with it
# (e.g. vercel-dark / vercel-light from vercel.com/geist/terminal):
#   green    ▲ marker, last command succeeded (bold)
#   red      ▲ marker, last command failed (bold), and its exit code
#   default  ▼ vi command-mode marker (terminal foreground)
#   white    Git branch / commit, read-only lock (ANSI 7, secondary gray)
#   purple   directory (bold), the one accent
#   yellow   dirty / in-progress Git state
# starship-plain.toml is the same layout in ASCII and 16 ANSI colors.
format = "$directory$git_branch$git_commit$git_state$git_status$status$character"
add_newline = false

[aws]
symbol = " "

[buf]
symbol = " "

[bun]
symbol = " "

[c]
symbol = " "

[character]
format = "$symbol "
success_symbol = "[▲](bold green)"
error_symbol = "[▲](bold red)"
vimcmd_symbol = "▼"

[cpp]
symbol = " "

[cmake]
symbol = " "

[conda]
symbol = " "

[crystal]
symbol = " "

[dart]
