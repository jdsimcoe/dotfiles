# Plain fallback for .config/starship.toml: the same minimal layout, but ASCII
# only and the 16 named ANSI colors, so it renders in any terminal and follows
# that terminal's own palette (light or dark). Selected from .zshrc unless the
# terminal is one of the known fancy ones (Ghostty, Terminal, iTerm2, Rex) or
# STARSHIP_FANCY=1 is set.
#
# ASCII substitutions for the fancy glyphs:
#   ▲ marker -> >      ▼ vi-cmd -> <      read-only lock -> " ro"
#   ⇡ ahead  -> ^      ⇣ behind -> v      ⇕ diverged -> ^v
#   ✘ deleted -> x     » renamed -> r     tag glyph -> " tag "
# Colors: directory bold purple, dirty/in-progress yellow, failure red. Branch and
# marker use the terminal foreground: ANSI gray (7/8) contrast varies too much
# between palettes to carry readable text.
"$schema" = 'https://starship.rs/config-schema.json'
format = "$directory$git_branch$git_commit$git_state$git_status$status$character"
add_newline = false

[character]
format = "$symbol "
success_symbol = ">"
error_symbol = "[>](red)"
vimcmd_symbol = "<"

[directory]
format = "[$path]($style)$read_only "
style = "purple bold"
truncation_length = 3
truncate_to_repo = true
home_symbol = "~"
read_only = " ro"

[git_branch]
format = "$branch "
only_attached = true

[git_commit]
format = "$hash$tag "
tag_symbol = " tag "

[git_state]
format = "[$state( $progress_current/$progress_total)]($style) "
style = "yellow"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "yellow"
ahead = "^"
behind = "v"
diverged = "^v"
conflicted = "="
deleted = "x"
modified = "!"
renamed = "r"
staged = "+"
stashed = "\\$"
untracked = "?"
up_to_date = ""

[status]
disabled = false
format = "[$status]($style) "
style = "red"
